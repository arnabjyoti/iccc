<div class="content-wrapper" #mapWrapper>
  <!-- Sub-Header Bar -->
  <div class="map-sub-header">
    <div class="d-flex align-items-center gap-2">
      <i class="fa fa-map-marker-alt text-dark"></i>
      <span>Live vehicle location and route monitoring</span>
    </div>

    <!-- Fullscreen Toggle Button -->
    <button class="btn-fullscreen" (click)="toggleFullscreen()" title="Toggle Fullscreen">
      <i class="fa" [ngClass]="isFullscreen ? 'fa-compress' : 'fa-expand'"></i>
      <span>{{ isFullscreen ? 'Exit Fullscreen' : 'Fullscreen' }}</span>
    </button>
  </div>

  <!-- Main Map Section -->
  <section class="content p-0 position-relative">
    <!-- Frosted Glass Card Loader -->
    <div class="loader-backdrop" *ngIf="loading">
      <div class="loader-card">
        <div class="spinner"></div>
        <p>Loading map and vehicles...</p>
      </div>
    </div>

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Bottom-Right Watermark Badge -->
    <div class="map-watermark">
      <span>Developed by </span>
      <a href="https://skaplinktechnologies.com" target="_blank" rel="noopener noreferrer">
        SkaplinkTechnologies.com
      </a>
    </div>
  </section>
</div>
